name: Deploy Keepsake lab 09

on:
  push:
    branches: [main]
    paths:
      - 'lab-09/**'
      - '.github/workflows/lab-09-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lab-09/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix lab-09
      - name: Build the site
        run: npm run build --prefix lab-09
        env:
          GITHUB_PAGES: 'true'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lab-09/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

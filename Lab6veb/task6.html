<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 6 - Popup</title>
    <link rel="stylesheet" href="style6.css">
</head>
<body>

    <header class="top-nav">
        <a href="#" class="nav-link" tabindex="0">Mail</a>
        <a href="#" class="nav-link" tabindex="0">Images</a>
        
        <input type="checkbox" id="popup-toggle" class="popup-checkbox">
        <label for="popup-toggle" class="popup-button" tabindex="0" title="Apps">
            <span class="grid-icon"></span>
        </label>

        <a href="#" class="icon-button" tabindex="0" title="Notifications">
            <span class="bell-icon">🔔</span>
        </a>
        <a href="#" class="profile-button" tabindex="0" title="Account">
            <img src="https://via.placeholder.com/32" alt="Avatar">
        </a>

        <div class="popup-wrapper">
            <input type="checkbox" id="more-toggle" class="more-checkbox">
            
            <div class="popup-container" tabindex="0">
                <div class="popup-grid">
                    <div class="grid-item" tabindex="0">
                        <div class="app-icon icon-calendar">📅</div>
                        <span class="app-label">Calendar</span>
                    </div>
                    <div class="grid-item" tabindex="0">
                        <div class="app-icon icon-mail">✉️</div>
                        <span class="app-label">Mail</span>
                    </div>
                    <div class="grid-item" tabindex="0">
                        <div class="app-icon icon-news">📰</div>
                        <span class="app-label">News</span>
                    </div>
                    <div class="grid-item" tabindex="0">
                        <div class="app-icon icon-map">📍</div>
                        <span class="app-label">Map</span>
                    </div>
                    <div class="grid-item" tabindex="0">
                        <div class="app-icon icon-files">📁</div>
                        <span class="app-label">Files</span>
                    </div>
                    <div class="grid-item" tabindex="0">
                        <div class="app-icon icon-contacts">👤</div>
                        <span class="app-label">Contacts</span>
                    </div>

                    <div class="grid-item extra-item" tabindex="0">
                        <div class="app-icon icon-translate">🔤</div>
                        <span class="app-label">Translate</span>
                    </div>
                    <div class="grid-item extra-item" tabindex="0">
                        <div class="app-icon icon-videos">▶️</div>
                        <span class="app-label">Videos</span>
                    </div>
                    <div class="grid-item extra-item" tabindex="0">
                        <div class="app-icon icon-search">🔍</div>
                        <span class="app-label">Search</span>
                    </div>
                    <div class="grid-item extra-item" tabindex="0">
                        <div class="app-icon icon-photo">🖼️</div>
                        <span class="app-label">Photo</span>
                    </div>
                    <div class="grid-item extra-item" tabindex="0">
                        <div class="app-icon icon-apps">📊</div>
                        <span class="app-label">Apps</span>
                    </div>
                    <div class="grid-item extra-item" tabindex="0">
                        <div class="app-icon icon-document">📄</div>
                        <span class="app-label">Document</span>
                    </div>
                </div>

                <label for="more-toggle" class="more-button" tabindex="0">More</label>

                <div class="scroll-content">
                    <div class="divider"></div>
                    <div class="popup-grid">
                        <div class="grid-item" tabindex="0">
                            <div class="app-icon">💬</div>
                            <span class="app-label">Chat</span>
                        </div>
                        <div class="grid-item" tabindex="0">
                            <div class="app-icon">🏫</div>
                            <span class="app-label">Classroom</span>
                        </div>
                        <div class="grid-item" tabindex="0">
                            <div class="app-icon">🔖</div>
                            <span class="app-label">Collection</span>
                        </div>
                        <div class="grid-item" tabindex="0">
                            <div class="app-icon">🔴</div>
                            <span class="app-label">Mars</span>
                        </div>
                        <div class="grid-item" tabindex="0">
                            <div class="app-icon">📝</div>
                            <span class="app-label">Blogs</span>
                        </div>
                        <div class="grid-item" tabindex="0">
                            <div class="app-icon">📢</div>
                            <span class="app-label">Promos</span>
                        </div>
                    </div>
                    <div class="footer-link">Even more from Kottans</div>
                </div>
            </div>
        </div>
    </header>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>

    <div class="card-container">
        <div class="main-card">
            <div class="arrow-controls">
                <span>&larr;</span>
                <span>&rarr;</span>
            </div>
            
            <div class="cloud"></div>

            <div class="main-temp">17</div>
        </div>

        <div class="forecast-card">
            <div class="day-item">
                <span class="day-name">Mon</span>
                <span class="day-temp">17&deg;</span>
            </div>
            <div class="day-item">
                <span class="day-name">Tue</span>
                <span class="day-temp">19&deg;</span>
            </div>
            <div class="day-item">
                <span class="day-name">Wed</span>
                <span class="day-temp">16&deg;</span>
            </div>
            <div class="day-item">
                <span class="day-name">Thu</span>
                <span class="day-temp">18&deg;</span>
            </div>
            <div class="day-item">
                <span class="day-name">Fri</span>
                <span class="day-temp">21&deg;</span>
            </div>
        </div>
    </div>

</body>
</html>
